<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{--frame:#dee1e6;--tab:#fff;--tool:#fff;--omni:#edf2fa;--omni-h:#e2e9f5;--chip:#fff;--text:#1f1f1f;--text2:#5f6368;--icon:#444746;--line:#dadce0;--cline:#d3d6db;--hov:rgba(31,31,31,.08);--act:rgba(31,31,31,.14);--blue:#0b57d0;--bluec:#d3e3fd;--onbluec:#041e49;--menu:#fff;--page:#fff;--card:#fff;--page2:#f8f9fa;--sel:#e9eef6;--sh:0 0 0 1px rgba(0,0,0,.07),0 6px 22px rgba(0,0,0,.22);
  font-family:Roboto,"Noto Sans SC",system-ui,sans-serif;font-size:13px;color:var(--text);user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 30% 38%,#5fb0f0 0,transparent 52%),radial-gradient(ellipse at 76% 70%,#8a5be0 0,transparent 50%),radial-gradient(ellipse at 55% 20%,#2c6fd6 0,transparent 55%),#0b2a5b}
body.dark{--frame:#202124;--tab:#35363a;--tool:#35363a;--omni:#202124;--omni-h:#2b2c30;--chip:rgba(255,255,255,.1);--text:#e3e3e3;--text2:#9aa0a6;--icon:#c4c7c5;--line:#4a4c50;--cline:#47494d;--hov:rgba(232,234,237,.1);--act:rgba(232,234,237,.18);--blue:#a8c7fa;--bluec:#0842a0;--onbluec:#d3e3fd;--menu:#2d2e31;--page:#202124;--card:#292a2d;--page2:#292a2d;--sel:#3c3d41;--sh:0 0 0 1px rgba(255,255,255,.08),0 6px 22px rgba(0,0,0,.6)}
body.forcedark .tabview iframe{filter:invert(1) hue-rotate(180deg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;outline:0}
input,select{font:inherit;color:inherit;outline:0}
svg{display:block;flex:none}
[hidden]{display:none!important}
.pg p{margin:0 0 10px}
#dicoimg{display:flex;justify-content:center;margin-bottom:6px}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
input:focus-visible,select:focus-visible{outline:0}
.iri{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#ff8254;flex:none;overflow:hidden}
.iri img{width:74%;height:74%;object-fit:contain;display:block;image-rendering:auto;-webkit-user-drag:none;pointer-events:none}
.favg{display:inline-flex;align-items:center;justify-content:center;color:var(--icon)}
.favg svg{width:100%;height:100%}
.fav{border-radius:3px;display:block;flex:none}
.avatar{width:26px;height:26px;border-radius:50%;background:#8ab4f8;color:#174ea6;display:flex;align-items:center;justify-content:center;overflow:hidden}
body.dark .avatar{background:#4d6fa5;color:#d3e3fd}
/* window */
#win{position:fixed;display:flex;flex-direction:column;background:var(--frame);overflow:hidden;z-index:10}
body.min #win,body.closed #win{display:none}
#win.opening{animation:wopen .18s cubic-bezier(.2,.8,.2,1)}
@keyframes wopen{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.rz{position:absolute;z-index:60;display:block}
body.max .rz{display:none}
.rz[data-d=n]{left:8px;right:8px;top:0;height:4px;cursor:ns-resize}
.rz[data-d=s]{left:8px;right:8px;bottom:0;height:4px;cursor:ns-resize}
.rz[data-d=e]{top:8px;bottom:8px;right:0;width:4px;cursor:ew-resize}
.rz[data-d=w]{top:8px;bottom:8px;left:0;width:4px;cursor:ew-resize}
.rz[data-d=ne]{right:0;top:0;width:8px;height:8px;cursor:nesw-resize}
.rz[data-d=sw]{left:0;bottom:0;width:8px;height:8px;cursor:nesw-resize}
.rz[data-d=nw]{left:0;top:0;width:8px;height:8px;cursor:nwse-resize}
.rz[data-d=se]{right:0;bottom:0;width:8px;height:8px;cursor:nwse-resize}
#shield{position:fixed;inset:0;z-index:4000;display:none}
#shield.on{display:block}
/* tab strip */
#tabstrip{display:flex;align-items:flex-end;height:41px;padding-left:8px;flex:none;position:relative}
.ts-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:var(--icon);flex:none}
.ts-btn:hover{background:var(--hov)}
.ts-btn:active{background:var(--act)}
#tabsearch{margin-right:4px}
#newtab{margin-left:4px}
#tabs{display:flex;position:relative;min-width:0;flex:0 1 auto;max-width:calc(100% - 340px)}
.spacer{flex:1;align-self:stretch;min-width:40px}
.tab{position:relative;height:34px;width:240px;flex:0 1 240px;min-width:34px;display:flex;align-items:center;padding:0;gap:8px;cursor:default}
.tab.enter{animation:tenter .16s ease-out}
@keyframes tenter{from{opacity:0;transform:scaleX(.5);transform-origin:left}to{opacity:1;transform:none}}
.tab.pinned{width:38px;flex:0 0 38px;justify-content:center}
.tab.pinned .tfav{margin:0}
.tab.pinned .ttitle,.tab.pinned .tclose{display:none}
.tab.active{flex-basis:240px;min-width:60px;z-index:2}
.tab.pinned.active{width:38px;flex-basis:38px;min-width:38px}
.tbg{position:absolute;inset:3px 2px 3px 2px;border-radius:8px;z-index:0}
.tab:not(.active):hover .tbg{background:var(--hov)}
.tab.active .tbg{inset:0;border-radius:8px 8px 0 0;background:var(--tab)}
.tab.active::before,.tab.active::after{content:'';position:absolute;bottom:0;width:8px;height:8px;z-index:0}
.tab.active::before{left:-8px;background:radial-gradient(circle at 0 0,transparent 7.5px,var(--tab) 8px)}
.tab.active::after{right:-8px;background:radial-gradient(circle at 100% 0,transparent 7.5px,var(--tab) 8px)}
.tab:not(.active):not(:hover)::after{content:'';position:absolute;right:-1px;top:9px;bottom:9px;width:1px;background:var(--text2);opacity:.4}
.tab:has(+ .tab.active)::after{display:none!important}
.tab.drag{z-index:5;opacity:.97}
.tab.drag .tbg{box-shadow:0 2px 8px rgba(0,0,0,.3);background:var(--tab);inset:0;border-radius:8px 8px 0 0}
.tfav,.ttitle,.tclose{position:relative;z-index:1}
.tfav{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;margin-left:12px}
.ttitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-size:12px;color:var(--text2);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.tab.active .ttitle{color:var(--text)}
.tclose{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none;margin-right:8px}
.tclose:hover{background:var(--act)}
.tclose svg{width:12px;height:12px}
.tab:not(.active) .tclose{opacity:.85}
body .tab.c1:not(.active) .tclose{display:none}
.tab.c2 .ttitle{display:none}.tab.c2:not(.active) .tfav{margin:0 auto}.tab.c2:not(.active) .tclose{display:none}.tab.c2.active .tfav{margin-left:10px}.tab.c2.active .tclose{margin:0 6px 0 auto}
.tab.c3.active .tfav{display:none}.tab.c3.active .tclose{margin:0 auto}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(11,87,208,.22);border-top-color:#0b57d0;animation:sp .8s linear infinite}
body.dark .spin{border-color:rgba(168,199,250,.25);border-top-color:#a8c7fa}
@keyframes sp{to{transform:rotate(360deg)}}
#incchip{align-self:center;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;margin-right:8px;border-radius:14px;background:rgba(255,255,255,.12);color:var(--text);font-size:12px}
/* hover card */
.hcard{position:fixed;z-index:2400;width:260px;background:var(--menu);color:var(--text);border-radius:10px;box-shadow:var(--sh);padding:12px 14px;pointer-events:none;font-size:12px}
.hcard .hct{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hcard .hcu{color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* toolbar */
#toolbar{display:flex;align-items:center;height:40px;padding:0 6px 0 5px;gap:2px;background:var(--tool);flex:none;position:relative;z-index:3}
.tb{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none}
.tb:hover:not(:disabled){background:var(--hov)}
.tb:active:not(:disabled){background:var(--act)}
.tb:disabled{opacity:.38}
#omnibox{flex:1;height:34px;border-radius:17px;background:var(--omni);display:flex;align-items:center;position:relative;margin:0 6px;min-width:80px;z-index:4}
#omnibox:hover:not(.focus){background:var(--omni-h)}
#omnibox.focus{background:var(--menu);box-shadow:inset 0 0 0 2px var(--blue)}
#omnibox.open{border-radius:17px 17px 0 0;box-shadow:inset 0 0 0 2px var(--blue),0 -2px 12px rgba(0,0,0,.12)}
#siteinfo{height:26px;min-width:26px;border-radius:13px;margin-left:4px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;color:var(--icon);font-size:12px;flex:none;background:var(--chip)}
#omnibox.focus #siteinfo{background:none}
#siteinfo:hover{background:var(--act)}
#siteinfo.warn{color:#b3261e;padding:0 8px 0 5px}
body.dark #siteinfo.warn{color:#f2b8b5}
#siteinfo.hide{display:none}
#urlbox{flex:1;min-width:0;height:100%;position:relative}
#url{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;font-size:14px;padding:0 8px;color:transparent;user-select:text;-webkit-user-select:text;text-overflow:clip}
#omnibox.focus #url{color:var(--text)}
#url::placeholder{color:var(--text2)}
#url::selection{background:rgba(11,87,208,.3);color:var(--text)}
#urlshow{position:absolute;inset:0;padding:0 8px;font-size:14px;line-height:34px;white-space:nowrap;overflow:hidden;pointer-events:none;color:var(--text2);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
#urlshow b{font-weight:400;color:var(--text)}
#omnibox.focus #urlshow{display:none}
#omnibox .ob{width:28px;height:28px;border-radius:50%;margin-right:3px;display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none}
#omnibox .ob:hover{background:var(--act)}
#star.on{color:var(--blue)}
#sugg{position:absolute;left:0;right:0;top:100%;background:var(--menu);border-radius:0 0 17px 17px;box-shadow:0 8px 16px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.06);padding:0 0 8px;z-index:900;overflow:hidden;clip-path:inset(0 -24px -24px -24px);border-top:1px solid var(--line)}
body.dark #sugg{box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
.sg{display:flex;align-items:center;height:44px;padding:0 8px 0 14px;gap:14px;font-size:14px;cursor:default;position:relative}
.sg.sel,.sg:hover{background:var(--sel)}
.sg .si{color:var(--icon);width:20px;display:flex;justify-content:center}
.sg .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.sg .ss{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue);font-size:13px;min-width:0;flex:1}
.sg .ss.gray{color:var(--text2)}
.sg .sx{width:28px;height:28px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--icon);flex:none}
.sg:hover .sx,.sg.sel .sx{display:flex}
.sg .sx:hover{background:var(--act)}
/* bookmarks bar */
#bmbar{display:flex;align-items:center;height:34px;padding:0 6px 2px;background:var(--tool);flex:none;position:relative;z-index:2}
#bmbar.hide{display:none}
#bmitems{flex:1;display:flex;overflow:hidden;min-width:0}
.bm{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:14px;max-width:170px;font-size:12px;flex:none;color:var(--text);cursor:default}
.bm:hover{background:var(--hov)}
.bm:active{background:var(--act)}
.bm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm svg{color:var(--icon)}
#bmother{margin-left:6px;position:relative}
#bmother::before{content:'';position:absolute;left:-4px;top:5px;bottom:5px;width:1px;background:var(--cline)}
#workspace{flex:1;display:flex;min-height:0;background:var(--tool);border-top:1px solid var(--cline)}
#content{position:relative;z-index:0;isolation:isolate;flex:1;background:var(--page);min-height:0;min-width:0;overflow:hidden}
.tabview{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--page)}
.tabview iframe{width:100%;height:100%;border:0;display:block;background:#fff}
/* side panel */
#sidepanel{width:332px;flex:none;background:var(--tool);border-left:1px solid var(--cline);display:flex;flex-direction:column;color:var(--text);animation:spin .18s ease-out}
@keyframes spin{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
#sidepanel .sph{display:flex;align-items:center;height:48px;padding:0 8px 0 18px;font-size:15px;font-weight:500;gap:6px}
#sidepanel .sph .t{flex:1}
#sidepanel .spb{flex:1;overflow:auto;padding:4px 18px 20px}
#sidepanel h4{margin:18px 0 10px;font-size:13px;font-weight:500;color:var(--text)}
.swg{display:flex;flex-wrap:wrap;gap:10px}
.swt{width:40px;height:40px;border-radius:50%;border:2px solid var(--cline);position:relative;display:flex;align-items:center;justify-content:center;color:var(--onbluec)}
.swt.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--menu),0 0 0 4px var(--blue)}
.seg{display:flex;border:1px solid var(--cline);border-radius:18px;overflow:hidden;height:36px}
.seg button{flex:1;font-size:13px}
.seg button+button{border-left:1px solid var(--cline)}
.seg button:hover{background:var(--hov)}
.seg button.on{background:var(--bluec);color:var(--onbluec)}
.bgg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgg button{height:64px;border-radius:10px;border:2px solid var(--cline);font-size:12px}
.bgg button.on{border-color:var(--blue)}
.sprow{display:flex;align-items:center;gap:12px;min-height:40px}
.sprow .l{flex:1}
/* find bar */
#findbar{position:absolute;right:24px;top:0;z-index:50;background:var(--menu);border-radius:0 0 12px 12px;box-shadow:var(--sh);display:flex;align-items:center;gap:2px;padding:6px 8px 6px 14px}
#findbar input{width:190px;height:30px;background:none;border:0;color:var(--text);font-size:14px;user-select:text}
#findbar .fsep{width:1px;height:20px;background:var(--cline);margin:0 6px}
#findbar .cnt{color:var(--text2);font-size:12px;min-width:34px;text-align:right}
#findbar .tb{width:28px;height:28px}
#findbar .fin{display:flex;align-items:center;background:var(--omni);border-radius:16px;padding:0 10px 0 12px;height:32px;gap:4px}
/* popup */
#layer{position:fixed;left:0;top:0;z-index:2500}
.menu{position:fixed;background:var(--menu);border-radius:12px;box-shadow:var(--sh);padding:8px 0;min-width:272px;font-size:13px;max-height:calc(100vh - 60px);overflow:auto;color:var(--text);animation:mopen .1s ease-out}
@keyframes mopen{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;height:32px;padding:0 12px 0 6px;margin:0 6px;border-radius:6px;cursor:default;white-space:nowrap}
.bubble .mi:hover,.menu .mi.hl{background:var(--hov)}
.mi.dis{opacity:.45;pointer-events:none}
.mi .ic{width:30px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--icon)}
.mi .lb{flex:1;padding:0 20px 0 6px;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.mi .k{color:var(--text2);font-size:12px;display:flex;align-items:center}
.ms{height:1px;background:var(--line);margin:6px 0}
.zrow{display:flex;align-items:center;height:36px;padding:0 6px 0 6px;margin:0 6px;gap:2px}
.zrow .ic{width:30px;display:flex;justify-content:center;color:var(--icon)}
.zrow .lb{flex:1;padding:0 6px}
.zrow button{height:28px;min-width:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.zrow button:hover{background:var(--hov)}
.zrow .zv{min-width:50px;text-align:center}
.zrow .zsep{width:1px;height:20px;background:var(--line);margin:0 4px}
.bubble{position:fixed;width:330px;background:var(--menu);border-radius:12px;box-shadow:var(--sh);padding:16px 20px;color:var(--text);animation:mopen .1s ease-out}
.bubble h3{margin:0 0 12px;font-size:15px;font-weight:500}
.bubble .brow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bubble .bmi{display:flex;align-items:center;gap:14px;height:40px;margin:0 -12px;padding:0 12px;border-radius:8px}
.bubble .bmi:hover{background:var(--hov)}
.bubble .bmi .ic{width:20px;display:flex;color:var(--icon)}
.bubble .bmi .lb{flex:1}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.fld input,.fld select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:0 10px;user-select:text}
.fld select option{background:var(--menu);color:var(--text)}
.fld input:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.btn{height:34px;padding:0 18px;border-radius:17px;border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:500}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--blue);color:#fff;border-color:transparent}
body.dark .btn.pri{color:#062e6f}
.btn.pri:hover{filter:brightness(1.1)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:2600}
.dlg{background:var(--menu);color:var(--text);border-radius:16px;padding:24px;width:min(500px,92vw);box-shadow:var(--sh);max-height:90vh;overflow:auto}
.dlg h2{font-size:17px;font-weight:500;margin:0 0 16px}
.dlg .dbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg label.chk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:#2f3033;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:5000}
#toast.show{opacity:1;transform:translateX(-50%)}
.prof{width:300px;text-align:center}
.prof .iri{margin:6px auto 10px}
/* internal pages */
.pg{position:absolute;inset:0;overflow:auto;background:var(--page);color:var(--text);font-size:14px;line-height:1.5;user-select:text;-webkit-user-select:text}
.ptop{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;padding:0 24px;gap:24px;background:var(--page2);border-bottom:1px solid var(--line)}
.ptitle{font-size:22px;font-weight:400;min-width:200px;display:flex;align-items:center;gap:12px}
.psearch{flex:1;max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;height:40px;border-radius:20px;background:var(--omni);padding:0 16px;color:var(--text2)}
.psearch:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.psearch input{flex:1;background:none;border:0;font-size:14px;color:var(--text)}
.pbody{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start}
.pside{width:248px;padding:16px 0;flex:none;position:sticky;top:60px}
.pside a{display:flex;align-items:center;gap:14px;padding:10px 24px;border-radius:0 24px 24px 0;margin-right:12px;color:var(--text);text-decoration:none;font-size:14px}
.pside a:hover{background:var(--hov)}
.pside a.on{background:rgba(26,115,232,.14);color:var(--blue)}
body.dark .pside a.on{background:rgba(138,180,248,.18)}
.pside a svg{color:inherit}
.pmain{flex:1;padding:24px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.card .hd{padding:14px 20px;font-weight:500;font-size:13px;color:var(--blue);border-bottom:1px solid var(--line)}
.dayh{padding:14px 20px 8px;font-size:13px;font-weight:500;color:var(--text);border-top:1px solid var(--line);background:var(--page2)}
.dayh:first-child{border-top:0}
.hrow{display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;height:44px;border-top:1px solid transparent}
.hrow:hover{background:var(--hov)}
.hrow .tm{width:68px;color:var(--text2);font-size:12px;flex:none}
.hrow .ht{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.hrow .hu{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-size:12px}
.hrow .tb{width:30px;height:30px;opacity:.7}
.hrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.empty{padding:60px 20px;text-align:center;color:var(--text2)}
.selbar{display:flex;align-items:center;gap:16px;background:var(--blue);color:#fff;border-radius:10px;padding:8px 16px;margin-bottom:14px}
body.dark .selbar{color:#202124}
.selbar button{font-weight:500}
.srow{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line);min-height:56px}
.srow:first-child{border-top:0}
.srow .stx{flex:1}
.srow .st{font-size:14px}
.srow .sd{font-size:12px;color:var(--text2);margin-top:2px}
.srow select,.srow input[type=text]{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:0 10px}
.srow.link{cursor:default}
.srow.link:hover{background:var(--hov)}
.sw{position:relative;width:36px;height:20px;display:inline-block;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:10px;background:#9aa0a6;transition:.15s}
.sw span::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw input:checked+span{background:var(--blue)}
body.dark .sw input:checked+span::before{background:#202124}
.sw input:checked+span::before{transform:translateX(16px)}
.big{font-size:28px;font-weight:400;margin:0 0 6px}
.kv{width:100%;border-collapse:collapse}
.kv td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;word-break:break-all}
.kv td:first-child{width:200px;color:var(--text2);word-break:normal}
.flag{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.flag:first-child{border-top:0}
.flag .fn{font-weight:500}
.flag .fd{color:var(--text2);font-size:13px;margin:2px 0}
.flag code{color:var(--blue);font-size:12px}
.flag select{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);padding:0 8px;margin-top:2px}
.flag .flx{flex:1}
/* ntp */
.ntp{display:flex;flex-direction:column;align-items:center}
.ntp.dk{color:#fff}
.ntpc{margin-top:max(9vh,40px);width:min(600px,92%);display:flex;flex-direction:column;align-items:center}
.ntplogo{display:flex;align-items:center;gap:16px;font-size:58px;font-weight:300;letter-spacing:-1px;margin-bottom:28px}
.ntplogo .iri{width:64px!important;height:64px!important}
.ntpsearch{width:100%;max-width:580px;height:46px;border-radius:23px;background:var(--page);border:1px solid var(--line);box-shadow:0 1px 6px rgba(32,33,36,.18);display:flex;align-items:center;padding:0 18px;gap:12px;color:var(--text2)}
.ntp.dk .ntpsearch{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.ntpsearch:hover,.ntpsearch:focus-within{box-shadow:0 1px 8px rgba(32,33,36,.32)}
.ntpsearch input{flex:1;background:none;border:0;font-size:16px;color:var(--text)}
.ntp.dk .ntpsearch input{color:#fff}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin-top:34px;width:100%;max-width:560px}
.tile{position:relative;width:112px;height:112px;border-radius:8px;display:flex;flex-direction:column;align-items:center;padding-top:14px;cursor:default}
.tile:hover{background:var(--hov)}
.tico{width:48px;height:48px;border-radius:50%;background:var(--omni);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.ntp.dk .tico{background:rgba(255,255,255,.2)}
.tname{font-size:12px;max-width:100px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmore{position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--text2)}
.ntp.dk .tmore{color:#fff}
.tile:hover .tmore{display:flex}
.tmore:hover{background:var(--act)}
.cust{position:absolute;right:20px;bottom:18px;height:36px;border-radius:18px;padding:0 16px;display:flex;align-items:center;gap:8px;background:var(--page2);border:1px solid var(--line);font-size:13px;color:var(--text)}
.cust:hover{background:var(--hov)}
.ntp.dk .cust{background:rgba(0,0,0,.35);color:#fff;border-color:transparent}
.incbox{max-width:620px;margin:10vh auto 0;padding:0 24px;color:var(--text)}
.incbox h1{font-size:28px;font-weight:400;margin:18px 0 10px}
.incbox p,.incbox li{color:var(--text2);margin:6px 0}
.incbox svg{color:var(--text)}
/* error */
.err{max-width:620px;margin:0 auto;padding:12vh 24px 40px;color:var(--text2)}
.err .eico{width:72px;height:72px;margin-bottom:22px;color:#9aa0a6}
.err h1{font-size:24px;font-weight:500;margin:0 0 14px;color:var(--text)}
.err ul{margin:10px 0 0 22px;list-style:disc}
.err .ecode{font-size:12px;margin-top:28px;color:var(--text2)}
.err .ebtn{display:flex;gap:10px;margin-top:26px}
.dinowrap{margin-top:30px;text-align:center}
.dinowrap canvas{width:100%;max-width:600px;display:block;margin:0 auto}
/* search results */
.res{max-width:720px;margin:0 auto;padding:20px 24px 60px}
.res .item{margin:0 0 22px}
.res .item a.t{font-size:19px;color:var(--blue)}
.res .item .u{font-size:12px;color:#188038}
body.dark .res .item .u{color:#81c995}
.res .item .sn{color:var(--text2);margin-top:2px}
.res .searchmatch{font-weight:600;color:var(--text)}
.res .alt{color:var(--text2);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.bmrow{display:flex;align-items:center;gap:14px;padding:0 10px 0 16px;height:48px;border-top:1px solid var(--line)}
.bmrow:first-child{border-top:0}
.bmrow:hover{background:var(--hov)}
.bmrow .bt{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bmrow .bu{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text2);font-size:12px}
.bmrow .tb{width:30px;height:30px}
.toolrow{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.toolrow .h{flex:1;font-size:18px}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border:3px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.6);border:3px solid transparent;background-clip:padding-box}
/* ---- overrides for internal pages ---- */
.pside a.on{background:var(--bluec);color:var(--onbluec)}
body.dark .pside a.on{background:var(--bluec);color:var(--onbluec)}
.pside a{font-size:14px;font-weight:400}
.card{border-radius:14px}
.card .hd{color:var(--blue)}
.selbar{background:var(--bluec);color:var(--onbluec)}
body.dark .selbar{color:var(--onbluec)}
.cust{background:var(--bluec);color:var(--onbluec);border:0;height:38px;font-weight:500}
.cust:hover{background:var(--bluec);filter:brightness(.96)}
.ntp.dk .cust{background:rgba(0,0,0,.4);color:#fff}
.ntpsearch{height:46px;border-radius:23px;background:var(--omni);border:1px solid transparent;box-shadow:none;position:relative}
.ntpsearch:hover{background:var(--omni-h)}
.ntpsearch:focus-within{background:var(--page);border-color:var(--cline);box-shadow:0 1px 6px rgba(32,33,36,.28)}
.ntpsearch .mic{display:flex;color:var(--icon);margin-left:4px}
.ntp.dk .ntpsearch .mic{color:#fff}
.ntplogo{letter-spacing:-1.5px}
.tico{background:var(--omni)}
.err{max-width:600px;padding:13vh 24px 40px;margin:0 auto}
.err h1{font-size:24px;font-weight:500;line-height:1.25}
.err .edet{margin-top:20px;font-size:13px}
.err .edet a{cursor:pointer}
.err .edmore{margin-top:10px;color:var(--text2);font-size:13px}
.err .ebtn{justify-content:space-between;margin-top:28px}
.res .item a.t{color:var(--blue)}
.ptop{background:var(--page)}
.psearch{background:var(--omni)}
.psearch:focus-within{box-shadow:inset 0 0 0 2px var(--blue);background:var(--page)}
/* ================= 桌面环境 ================= */
body{font-family:Roboto,"Google Sans","Noto Sans CJK SC","Noto Sans SC","Noto Sans","Droid Sans Fallback","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --shelf:rgba(238,241,246,.8);--shelf-fg:#1f1f1f;--shelf-hov:rgba(0,0,0,.08);--sttray:rgba(0,0,0,.07);--osb:rgba(248,250,253,.97);--osfg:#1f1f1f;--os2:#5f6368;--ostile:#e1e6ee;--osacc:#0b57d0;--osaccfg:#fff;--osline:rgba(0,0,0,.12)}
body.osdark{--shelf:rgba(32,33,36,.78);--shelf-fg:#e8eaed;--shelf-hov:rgba(255,255,255,.14);--sttray:rgba(255,255,255,.1);--osb:rgba(41,42,45,.97);--osfg:#e8eaed;--os2:#9aa0a6;--ostile:#3c4043;--osacc:#a8c7fa;--osaccfg:#062e6f;--osline:rgba(255,255,255,.14)}
#desktop{position:fixed;inset:0;background-size:cover;background-position:center}
#snapprev{position:fixed;z-index:5;border-radius:12px;background:rgba(138,180,248,.26);border:2px solid rgba(138,180,248,.75);pointer-events:none;display:none;transition:left .1s,top .1s,width .1s,height .1s}
/* 置物架 (Shelf) */
#shelf{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:4px;padding:0 8px 0 6px;z-index:3000;background:var(--shelf);color:var(--shelf-fg);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 -1px 0 rgba(255,255,255,.06)}
body.fs #shelf{display:none}
#shelf .sbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;margin-right:4px;color:var(--shelf-fg)}
#shelf .sbtn:hover,#shelf .sbtn.lon{background:var(--shelf-hov)}

/* ================= Chromium 最新桌面版 (Chrome Refresh 2023+) 精修 ================= */

/* ================= 动效与细节精修 ================= */
:root{--ease:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1)}
/* 标签页：宽度/淡入淡出动画 */
.tab{transition:flex-basis .2s var(--ease),min-width .2s var(--ease),opacity .18s linear}
.tab.entering{flex-basis:0!important;min-width:0!important;opacity:0;overflow:hidden}
.tab.closing{flex-basis:0!important;min-width:0!important;opacity:0;pointer-events:none;overflow:hidden;transition:flex-basis .2s var(--ease),min-width .2s var(--ease),opacity .14s linear}
#tabs.lock .tab:not(.closing){transition:opacity .18s linear}
.tab.drag{transition:none}
.tab .tbg{transition:background-color .1s linear}
.tclose{transition:background-color .08s linear,opacity .1s linear}
.tclose::before{content:'';position:absolute;inset:-4px}
/* 加载指示器 (Throbber)：先灰色逆时针等待，收到响应后蓝色顺时针 */
.spin{width:16px;height:16px;border:2px solid var(--blue);border-left-color:transparent;border-radius:50%;background:none;animation:tspw .66s linear 1 forwards,tsp .8s linear .66s infinite}

@keyframes tspw{from{transform:rotate(0);border-color:var(--text2);border-left-color:transparent}to{transform:rotate(-360deg);border-color:var(--text2);border-left-color:transparent}}
@keyframes tsp{from{transform:rotate(0);border-color:var(--blue);border-left-color:transparent}to{transform:rotate(360deg);border-color:var(--blue);border-left-color:transparent}}
/* 状态层 + 水波 */
.tb,.ts-btn,#omnibox .ob,#winctl button,#shelf .sbtn,.qc,#status{position:relative}
.rip{position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.14;pointer-events:none;animation:ripin .24s var(--ease)}
@keyframes ripin{from{transform:scale(.45);opacity:0}to{transform:scale(1);opacity:.14}}
.rip.out{animation:none;opacity:0;transition:opacity .3s linear}
/* 窗口：最大化/还原/最小化/关闭动画 */
#win.wanim{transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease),border-radius .26s var(--ease)}

.sitem.bounce>*{animation:sbounce .5s cubic-bezier(.3,0,.2,1)}
@keyframes sbounce{0%,100%{transform:none}30%{transform:translateY(-9px)}60%{transform:none}78%{transform:translateY(-3px)}}
/* 对话框 / 悬停卡片 / 联想下拉 */

.dlg{animation:dpop .22s var(--ease)}
@keyframes ofade{from{opacity:0}}

.hcard:not([hidden]){animation:hcin .14s linear}

#omnibox{transition:background-color .12s linear}

/* ================= 多窗口管理 (每个窗口是桌面上的一个 .wframe，内部为独立的 Iridium 实例) ================= */
html.emb,html.emb body{background:transparent!important}
body.emb #desktop,body.emb #snapprev,body.emb #shelf,body.emb #dim,body.emb #night,body.emb .rz{display:none!important}
body.emb #win{left:0!important;top:0!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;border-radius:0!important;box-shadow:none!important}

body.host #snapprev{z-index:2900}
#dropline{position:absolute;bottom:3px;width:3px;height:30px;border-radius:2px;background:var(--blue);z-index:30;pointer-events:none;box-shadow:0 0 0 1px var(--frame)}
.wframe{position:fixed;z-index:100;border-radius:12px;background:#dee1e6;min-width:500px;min-height:360px;transform-origin:0 0;
  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 40px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.18)}
body.dark .wframe{background:#202124;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 40px rgba(0,0,0,.6)}
.wframe.blur{box-shadow:0 0 0 1px rgba(0,0,0,.16),0 6px 22px rgba(0,0,0,.26)}
body.dark .wframe.blur{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 6px 22px rgba(0,0,0,.45)}
.wframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:inherit;background:transparent;opacity:0;transition:opacity .12s}
.wframe.rdy iframe{opacity:1}
.wframe.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0;box-shadow:none;min-width:0;min-height:0}
.wframe.fs{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;box-shadow:none;z-index:3500!important;min-width:0;min-height:0}
.wframe.wanim{transition:left .26s cubic-bezier(.2,0,0,1),top .26s cubic-bezier(.2,0,0,1),width .26s cubic-bezier(.2,0,0,1),height .26s cubic-bezier(.2,0,0,1),border-radius .26s}
.wframe.opening{animation:wfo .22s cubic-bezier(.2,.8,.2,1)}
.wframe.minning{animation:wfm .2s cubic-bezier(.4,0,1,1) forwards}
.wframe.wclosing{animation:wfc .15s cubic-bezier(.4,0,1,1) forwards}
@keyframes wfo{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes wfm{to{opacity:0;transform:translate(var(--mx,0),var(--my,80px)) scale(.25)}}
@keyframes wfc{to{opacity:0;transform:scale(.9)}}
.wframe.merging{opacity:0;pointer-events:none;transition:opacity .08s}
.wcover{position:absolute;inset:0;display:none;z-index:5;cursor:pointer;border-radius:inherit}
.wrz{position:absolute;z-index:6;display:block}
.wframe.max .wrz,.wframe.fs .wrz,.wframe.ov .wrz{display:none}
.wrz[data-d=n]{left:10px;right:10px;top:-5px;height:7px;cursor:ns-resize}
.wrz[data-d=s]{left:10px;right:10px;bottom:-5px;height:7px;cursor:ns-resize}
.wrz[data-d=e]{top:10px;bottom:10px;right:-5px;width:7px;cursor:ew-resize}
.wrz[data-d=w]{top:10px;bottom:10px;left:-5px;width:7px;cursor:ew-resize}
.wrz[data-d=ne]{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}
.wrz[data-d=sw]{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.wrz[data-d=nw]{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}
.wrz[data-d=se]{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
body.wdrag .wframe iframe{pointer-events:none}
body.wfs #shelf{display:none}
/* 窗口概览 */
#ovl{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:wfo .2s ease-out}
.wframe.ov,.wframe.ovx{transition:transform .28s cubic-bezier(.2,0,0,1)}

.ovt button:hover{background:rgba(255,255,255,.38)}
@media (prefers-reduced-motion:reduce){.wframe.opening,.wframe.minning,.wframe.wclosing,#ovl,.ovt{animation-duration:.01ms!important}.wframe.wanim,.wframe.ov,.wframe.ovx{transition-duration:.01ms!important}}

/* ================= 窗口动画 / 标签栏细节 ================= */
/* 窗口：最大化/还原/贴靠改用 JS(FLIP) 的 transform 动画，不再过渡 left/top/width/height，避免 iframe 每帧重排 */
.wframe.wanim{transition:none!important}
.wframe.opening{transform-origin:50% 50%;animation:wfo2 .24s cubic-bezier(.2,0,0,1)}
.wframe.wclosing{transform-origin:50% 50%;animation:wfc2 .16s cubic-bezier(.4,0,1,1) forwards}
@keyframes wfo2{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes wfc2{to{opacity:0;transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){.wframe.opening,.wframe.wclosing{animation-duration:.01ms!important}}
/* 标签栏：与真实 Chromium 一致，最右侧标签也保留右下角向外扩的圆角（活动时）和右侧分隔线（非活动时）。
   正在收起的标签不绘制装饰，避免动画中残影 */
.tab.closing::before,.tab.closing::after{display:none!important}

function listOf(id){if(id==='bar')return BM.bar;if(id==='other')return BM.other;const f=findNode(id);return f&&f.children||[]}

(function(){
  const box=$('#bmitems');let st=null;
  const clean=()=>{if(!st)return;st.ghost&&st.ghost.remove();st.line&&st.line.remove();st.d.style.opacity='';$$('.bm.bmdrop',box).forEach(x=>x.classList.remove('bmdrop'));if(st.on)shieldOff();st=null;document.body.classList.remove('bmdragging')};
  box.addEventListener('mousedown',e=>{if(e.button!==0)return;const d=e.target.closest('.bm');if(!d||!d.dataset.id)return;st={d,id:d.dataset.id,x:e.clientX,y:e.clientY,on:false,drop:null}});
  document.addEventListener('mousemove',e=>{
    if(!st)return;
    if(!st.on){
      if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<6)return;
      st.on=true;closePopups();shieldOn('default');document.body.classList.add('bmdragging');
      st.ghost=st.d.cloneNode(true);st.ghost.className='bm bmghost';st.ghost.removeAttribute('title');document.body.append(st.ghost);
      st.line=el('<div class="bmline" hidden></div>');document.body.append(st.line);st.d.style.opacity='.4';
    }
    st.ghost.style.left=(e.clientX+10)+'px';st.ghost.style.top=(e.clientY+6)+'px';
    const br=box.getBoundingClientRect();$$('.bm.bmdrop',box).forEach(x=>x.classList.remove('bmdrop'));
    st.drop=null;st.line.hidden=true;
    if(e.clientY<br.top-24||e.clientY>br.bottom+24||e.clientX<br.left-12||e.clientX>br.right+12)return;
    const items=[...box.children].filter(c=>c!==st.d&&c.style.visibility!=='hidden');
    let before=null,x=null;
    for(const c of items){
      const r=c.getBoundingClientRect(),n=findNode(c.dataset.id);
      if(n&&n.type==='folder'&&e.clientX>r.left+r.width*.28&&e.clientX<r.right-r.width*.28){c.classList.add('bmdrop');st.drop={into:n.id};return}
      if(e.clientX<r.left+r.width/2){before=c;x=r.left;break}
    }
    if(!before){const l=items[items.length-1];x=l?l.getBoundingClientRect().right:br.left}
    st.drop={before:before?before.dataset.id:null};
    const ln=st.line;ln.hidden=false;ln.style.left=(x-1)+'px';ln.style.top=(br.top+br.height/2-12)+'px';
  });
  document.addEventListener('mouseup',e=>{
    if(!st)return;
    if(st.on){
      bmDragSup=true;setTimeout(()=>{bmDragSup=false},60);
      const drop=st.drop,node=findNode(st.id);
      if(drop&&node){
        if(drop.into&&drop.into!==node.id&&!(node.type==='folder'&&findIn(node,drop.into))){const f=findNode(drop.into);removeNode(node.id);f.children.push(node);saveBM();toast('已移至“'+f.title+'”')}
        else if(drop.before!==undefined){removeNode(node.id);const i=drop.before?BM.bar.findIndex(n=>n.id===drop.before):-1;if(i<0)BM.bar.push(node);else BM.bar.splice(i,0,node);saveBM()}
      }
      renderBmBar();
    }
    clean();
  });
  document.addEventListener('keydown',e=>{if(st&&e.key==='Escape'){e.stopImmediatePropagation();clean();renderBmBar();bmDragSup=true;setTimeout(()=>{bmDragSup=false},60)}},true);
})();

  const fn=(u.protocol==='chrome-search:'?(h==='results'?pageSearch:null):(h==='results'?null:map[h]));

function dino(cv){
  const c=cv.getContext('2d'),W=600,H=170;cv.width=W;cv.height=H;
  let y=0,vy=0,spd=6,score=0,obs=[],over=false,run=false,fr=0,next=70,hi=+store.get('dinohi',0);
  const col=()=>document.body.classList.contains('dark')?'#d0d0d0':'#535353';
  const bg=()=>document.body.classList.contains('dark')?'#202124':'#fff';
  const reset=()=>{y=0;vy=0;spd=6;score=0;obs=[];over=false;run=true;next=60;fr=0};
  const jump=()=>{if(over){reset();return}if(!run)run=true;if(y===0)vy=10.8};
  cv.addEventListener('mousedown',jump);
  const kh=e=>{
    if(!cv.isConnected){document.removeEventListener('keydown',kh);return}
    if(cv.offsetParent===null)return;
    if((e.code==='Space'||e.code==='ArrowUp')&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();jump()}
  };
  document.addEventListener('keydown',kh);
  const pad=n=>String(Math.floor(n)).padStart(5,'0');
  function step(){
    if(!run||over)return;fr++;
    vy-=0.6;y=Math.max(0,y+vy);if(y===0&&vy<0)vy=0;
    score+=spd/40;spd+=0.0012;next--;
    if(next<=0){obs.push({x:W,w:14+Math.random()*14,h:28+Math.random()*20});next=55+Math.random()*60-spd}
    obs.forEach(o=>o.x-=spd);obs=obs.filter(o=>o.x+o.w>0);
    const dx1=40,dx2=76,dt=H-20-44-y,db=H-20-y;
    for(const o of obs){if(o.x<dx2-4&&o.x+o.w>dx1+4&&db>H-20-o.h+4){over=true;if(score>hi){hi=score;store.set('dinohi',Math.floor(hi))}}}
  }
  function draw(){
    c.fillStyle=bg();c.fillRect(0,0,W,H);c.fillStyle=col();c.fillRect(0,H-20,W,1);
    const top=H-20-44-y;
    c.fillRect(58,top,22,16);c.fillRect(40,top+12,32,22);c.fillRect(34,top+14,8,8);c.fillRect(70,top+22,6,4);c.fillRect(66,top+14,6,10);
    c.fillStyle=bg();c.fillRect(70,top+3,3,3);c.fillStyle=col();
    if(y>0||over||!run){c.fillRect(46,top+34,6,10);c.fillRect(60,top+34,6,10)}
    else if(Math.floor(fr/6)%2){c.fillRect(46,top+34,6,10);c.fillRect(60,top+34,6,5)}else{c.fillRect(46,top+34,6,5);c.fillRect(60,top+34,6,10)}
    obs.forEach(o=>{const bt=H-20-o.h;c.fillRect(o.x+o.w/2-3,bt,6,o.h);c.fillRect(o.x,bt+8,o.w/2-1,5);c.fillRect(o.x,bt+4,4,9);c.fillRect(o.x+o.w/2+3,bt+12,o.w/2-3,5);c.fillRect(o.x+o.w-4,bt+8,4,9)});
    c.font='14px monospace';c.textAlign='right';c.fillStyle=col();c.fillText('HI '+pad(hi)+'  '+pad(score),W-14,24);
    c.textAlign='center';
    if(over){c.font='bold 18px monospace';c.fillText('G A M E   O V E R',W/2,70);c.font='12px monospace';c.fillText('按空格键或点击重新开始',W/2,92)}
    else if(!run){c.font='12px monospace';c.fillText('按空格键或点击开始',W/2,70)}
  }
  (function loop(){if(!cv.isConnected)return;requestAnimationFrame(loop);if(cv.offsetParent===null)return;step();draw()})();
}

    const dur=Math.round(Math.max(200,Math.min(300,200+(Math.abs(r1.width-r2.width)+Math.abs(r1.height-r2.height))/20)));
    track(w,fr.animate([
      {transformOrigin:'0 0',transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',borderRadius:(rad1/sx)+'px / '+(rad1/sy)+'px',boxShadow:sh1},
      {transformOrigin:'0 0',transform:'translate(0px,0px) scale(1,1)',borderRadius:rad2+'px',boxShadow:sh2}

  }
  /* 置物架图标中心相对窗口中心的偏移 */

  }

  /* ---------- 创建 / 关闭 ---------- */
  function create(o){
    o=o||{};
    const w={id:o.id||uid(),inc:!!o.inc,max:false,min:false,fs:false,snap:null,ready:false,pending:o.tabs||null,url:o.url||null,mode:o.mode||'new',
      title:'新标签页',n:1,tabs:[],z:0,b:null,rb:o.rb?clone(o.rb):null,seq:++seq};
    const base=byId(focus)||order()[0];

      else{const b=clone(base.b);b.x+=32;b.y+=32;if(b.x+b.w>innerWidth-20||b.y+b.h>H())b.x=40,b.y=24;w.b=clampB(b)}

      ['n','s','e','w','ne','nw','se','sw'].map(d=>'<i class="wrz" data-d="'+d+'"></i>').join('')+'</div>');

    $('.wcover',fr).addEventListener('click',()=>{if(ov)exitOv(w)});
    if(!o.noFocus){focus=w.id}

  }
  function closeWin(w,merged){

    const fin=()=>{

      w.fr.remove();

        if(merged||wins.some(x=>!x.inc)){try{localStorage.removeItem('iridium.session.'+w.id);localStorage.removeItem('iridium.groups.'+w.id)}catch(e){}}

  function openApp0(){

  /* ---------- 焦点 / 层叠 ---------- */
  function raise(w){

  function focusWin(w,noIframeFocus){

  function minimize(w){

      if(focus===w.id){focus=null;const n=order().find(x=>!x.min);if(n){focusWin(n);saveWins();return}}
      pushAll();saveWins();
    };
    if(reduce()||ov||w.fr.style.display==='none'){done();return}
    const v=shelfVec(w),rad=parseFloat(getComputedStyle(w.fr).borderTopLeftRadius)||0;
    cancelAn(w);w._minning=true;
    const a=w.fr.animate([
      {transformOrigin:'50% 50%',transform:'translate(0px,0px) scale(1)',opacity:1,borderRadius:rad+'px'},
      {offset:.55,opacity:.85},
      {transformOrigin:'50% 50%',transform:'translate('+v.dx+'px,'+v.dy+'px) scale('+v.sc+')',opacity:0,borderRadius:Math.round(14/v.sc)+'px'}

  function restore(w){

    if(reduce()||ov)return;
    const v=shelfVec(w),rad=parseFloat(getComputedStyle(w.fr).borderTopLeftRadius)||0;
    cancelAn(w);
    track(w,w.fr.animate([
      {transformOrigin:'50% 50%',transform:'translate('+v.dx+'px,'+v.dy+'px) scale('+v.sc+')',opacity:0,borderRadius:Math.round(14/v.sc)+'px'},
      {offset:.35,opacity:.9},
      {transformOrigin:'50% 50%',transform:'translate(0px,0px) scale(1)',opacity:1,borderRadius:rad+'px'}

  }
  function cycle(){const l=order().filter(x=>!x.closing);if(l.length>1)focusWin(l[l.length-1])}

  /* ---------- 最大化 / 吸附 / 全屏 ---------- */
  function setMax(w,on){
    if(w.fs)return;

    flip(w,()=>{
      if(on){if(!w.max&&!w.snap)w.rb=clone(w.b);w.max=true;w.snap=null}
      else{w.max=false;w.snap=null;w.b=clampB(clone(w.rb||w.b));place(w)}

  }
  function snap(w,side){

  function setFs(w,on){

    else if(!wins.some(x=>x.fs)&&document.fullscreenElement){try{document.exitFullscreen().catch(()=>{})}catch(e){}}
  }
  document.addEventListener('fullscreenchange',()=>{

  /* ---------- 拖动 / 缩放 ---------- */
  function startResize(w,h,e){

    if(w.snap){w.snap=null}
    D={w:w,kind:'resize',dir:h.dataset.d,px0:e.clientX,py0:e.clientY,b0:clone(w.b),ofx:0,ofy:0,started:true};

  }
  function beginDrag(w,m){

  function startMove(px,py){

      const b=clone(w.rb||defB());

  function tabOut(src,m){

    const sz=(src.max||src.snap)?(src.rb||defB()):src.b;

    const w=create({tabs:[m.tab],inc:src.inc,max:false,b:{x:px-ox,y:Math.max(0,py-oy),w:sz.w,h:sz.h},mode:'new'});
    w.b.x=px-ox;w.b.y=Math.max(0,py-oy);place(w);

  function hitStrip(px,py,self){

  }
  function snapHint(p){

    if(p[1]<=2)r=[0,0,W,h];else if(p[0]<=2)r=[0,0,W/2,h];else if(p[0]>=W-2)r=[W/2,0,W/2,h];

  function dragAt(px,py,btn){

      if(d.includes('e'))b.w=Math.max(500,b0.w+dx);

      if(d.includes('w')){b.w=Math.max(500,b0.w-dx);b.x=b0.x+b0.w-b.w}
      if(d.includes('n')){b.h=Math.max(360,b0.h-dy);b.y=b0.y+b0.h-b.h;if(b.y<0){b.h+=b.y;b.y=0}}

  function exportTabs(w){

  /* ---------- 最大化悬停气泡 (贴靠布局) ---------- */
  function rmSB(){clearTimeout(sbT);$$('.snapbub').forEach(x=>x.remove())}
  function showSB(w,m){
    clearTimeout(sbT);if($('.snapbub'))return;
    const fr=w.ifr.getBoundingClientRect();
    const b=el('<div class="snapbub"><button data-s="l" title="靠左分屏"><i style="left:0;width:50%"></i></button><button data-s="m" title="最大化"><i style="left:0;width:100%"></i></button><button data-s="r" title="靠右分屏"><i style="right:0;width:50%"></i></button></div>');
    document.body.append(b);

  /* ---------- 窗口概览 ---------- */
  function enterOv(){
    if(!wins.length||ov)return;
    closeOS();closePopups();rmSB();
    const bd=el('<div id="ovl"></div>');document.body.append(bd);
    ov={bd:bd,labels:[]};bd.onclick=()=>exitOv();
    wins.forEach(w=>{w.fr.classList.add('ov');w.fr.style.display=''});
    try{if(document.activeElement)document.activeElement.blur();window.focus()}catch(e){}
    ovLayout();
  }
  function ovLayout(){
    if(!ov)return;
    ov.labels.forEach(l=>l.remove());ov.labels=[];
    const list=wins.filter(w=>!w.closing).sort((a,b)=>a.seq-b.seq),n=list.length;
    if(!n){exitOv();return}
    const W=innerWidth,h=H(),pad=34;
    const cols=Math.min(n,Math.ceil(Math.sqrt(n*W/h))),rows=Math.ceil(n/cols),cw=W/cols,ch=h/rows;
    list.forEach((w,i)=>{
      const c=i%cols,r=Math.floor(i/cols),inRow=r===rows-1?n-(rows-1)*cols:cols,x0=(W-inRow*cw)/2;
      const full=w.max||w.fs,nl=full?0:w.b.x,nt=full?0:w.b.y,nw=full?W:w.b.w,nh=full?(w.fs?innerHeight:h):w.b.h;
      const s=Math.min((cw-pad*2)/nw,(ch-pad*2-30)/nh,1);
      const tx=x0+c*cw+(cw-nw*s)/2,ty=r*ch+34+(ch-34-nh*s)/2;
      w.fr.style.transform='translate('+(tx-nl)+'px,'+(ty-nt)+'px) scale('+s+')';
      const lb=el('<div class="ovt">'+IRI(18)+'<span class="wct"></span><button title="关闭窗口">'+svg(P.close,14)+'</button></div>');
      $('.wct',lb).textContent=(w.inc?'[无痕] ':'')+(w.title||'新标签页');
      lb.style.left=tx+'px';lb.style.top=(ty-30)+'px';lb.style.width=Math.max(120,nw*s)+'px';
      $('button',lb).onclick=ev=>{ev.stopPropagation();closeWin(w)};
      document.body.append(lb);ov.labels.push(lb);
    });
  }
  function exitOv(sel){

    wins.forEach(w=>{
      w.fr.classList.remove('ov');w.fr.classList.add('ovx');w.fr.style.transform='';
      setTimeout(()=>{w.fr.classList.remove('ovx');if(w.min)w.fr.style.display='none'},300);

  }
  const toggleOv=()=>ov?exitOv():enterOv();

  /* ---------- 对外接口 ---------- */
  const WM=window.WM={

  /* ---------- 来自各窗口的消息 ---------- */

        if(m.tabs){o.tabs=m.tabs;o.inc=w.inc}
        create(o);break}
      case 'movetab':{const t2=byId(m.to);if(t2){send(t2,'adopt',{tabs:[m.tab]});focusWin(t2)}break}
      case 'dragstart':beginDrag(w,m);break;
      case 'tabout':tabOut(w,m);break;
      case 'dragmove':if(D&&D.kind==='move')dragAt(m.sx+D.ofx,m.sy+D.ofy,m.b);break;
      case 'dragend':if(D&&D.kind==='move')dragEnd(m.cancel?D.w.b.x+D.ox:m.sx+D.ofx,m.cancel?D.w.b.y+D.oy:m.sy+D.ofy);break;
      case 'sbshow':showSB(w,m);break;
      case 'sbhide':clearTimeout(sbT);sbT=setTimeout(rmSB,250);break;
      case 'exported':{const f=reqs[m.req];if(f){delete reqs[m.req];f(m.tabs)}break}
    }
  });

  /* ---------- 置物架：窗口列表 / 右键菜单 ---------- */
  window.updateShelf=function(){
    const s=$('#sh-iri');if(!s)return;
    s.classList.toggle('run',wins.length>0);
    s.classList.toggle('act',wins.some(w=>w.id===focus&&!w.min));
    s.dataset.tt=wins.length>1?'Iridium（'+wins.length+' 个窗口）':'Iridium';
  };
  const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
  function shelfMenu(){
    const r=$('#sh-iri').getBoundingClientRect(),ic=p=>svg(p,18);
    const items=[...wins].sort((a,b)=>a.seq-b.seq).map(w=>({
      label:(w.inc?'[无痕] ':'')+trunc(w.title||'新标签页',34),icon:ic(P.win),checked:focus===w.id&&!w.min,
      key:w.min?'已最小化':(w.n>1?w.n+' 个标签页':''),fn:()=>focusWin(w)}));
    if(items.length)items.push('-');
    items.push(
      {label:'新建窗口',icon:ic(P.add),key:'Ctrl+N',fn:()=>WM.newWindow(false)},
      {label:'新建无痕窗口',icon:ic(P.inc),key:'Ctrl+Shift+N',fn:()=>WM.newWindow(true)},
      wins.length?{label:'窗口概览',icon:ic(P.full),key:'Ctrl+Alt+W',fn:toggleOv}:null,
      wins.length?'-':null,
      wins.length?{label:wins.length>1?'关闭所有窗口':'关闭窗口',icon:ic(P.close),fn:()=>[...wins].forEach(x=>closeWin(x))}:null);
    showMenu(items,r.left,r.top-4);
  }
  $('#sh-iri').onclick=()=>{
    closeOS();
    if(ov){exitOv();return}
    if(!wins.length){openApp0();return}
    if(wins.length===1){const w=wins[0];if(w.min)restore(w);else if(focus===w.id)minimize(w);else focusWin(w);return}
    shelfMenu();
  };
  $('#sh-iri').addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();closeOS();shelfMenu()});
  document.addEventListener('contextmenu',e=>{
    if(e.target.id!=='desktop')return;
    e.preventDefault();e.stopPropagation();closeOS();
    const ic=p=>svg(p,18);
    showMenu([
      {label:'新建窗口',icon:ic(P.win),key:'Ctrl+N',fn:()=>WM.newWindow(false)},
      {label:'新建无痕窗口',icon:ic(P.inc),key:'Ctrl+Shift+N',fn:()=>WM.newWindow(true)},
      wins.length?{label:'窗口概览',icon:ic(P.full),key:'Ctrl+Alt+W',fn:toggleOv}:null,'-',
      {label:'设置壁纸和样式',icon:ic(P.edit),fn:()=>openOsSettings('personal')},
      {label:'显示器设置',icon:ic(P.bright),fn:()=>openOsSettings('display')},
      {label:'关于 IridiumOS',icon:ic(P.info),fn:()=>openOsSettings('about')}
    ],e.clientX,e.clientY);
  },true);

  /* ---------- 桌面级快捷键 / 点击桌面使窗口变为非活动 ---------- */
  document.addEventListener('mousedown',e=>{
    if(e.target.id==='desktop'&&focus&&!ov){focus=null;pushAll()}
  },true);
  document.addEventListener('keydown',e=>{
    if(document.body.classList.contains('locked')||$('#poff'))return;
    if(e.key==='Escape'&&ov){exitOv();return}
    const c=e.ctrlKey||e.metaKey,k=(e.key||'').toLowerCase(),fw=byId(focus);
    if(c&&!e.altKey&&!e.shiftKey&&k==='n'){e.preventDefault();WM.newWindow(false)}
    else if(c&&!e.altKey&&e.shiftKey&&k==='n'){e.preventDefault();WM.newWindow(true)}
    else if(c&&e.altKey&&e.code==='KeyW'){e.preventDefault();toggleOv()}
    else if(e.altKey&&!c&&!e.shiftKey){
      if(e.code==='Backquote'){e.preventDefault();cycle()}
      else if(fw&&e.code==='BracketLeft'){e.preventDefault();snap(fw,'l')}
      else if(fw&&e.code==='BracketRight'){e.preventDefault();snap(fw,'r')}
      else if(fw&&e.code==='Minus'){e.preventDefault();minimize(fw)}
      else if(fw&&e.code==='Equal'){e.preventDefault();setMax(fw,!fw.max)}
    }
  },true);

  /* ---------- 启动：恢复窗口 ---------- */
  (function start(){
    const p=new URLSearchParams(location.search);
    const clean=keep=>{
      try{
        Object.keys(localStorage).forEach(k=>{
          const m=k.match(/^iridium\.(session|groups)\.(.+)$/);
          if(m&&!keep.has(m[2]))localStorage.removeItem(k);
        });
      }catch(e){}
    };
    if(p.has('u')||p.has('incognito')){
      if(!p.has('incognito'))clean(new Set());
      create({inc:p.has('incognito'),url:p.get('u'),mode:'new',max:true});
    }else if(S.startup==='continue'){
      let list=store.get('wins',[]);
      if(!list.length){const lw=store.get('lastwin',null);if(lw){list=[lw];store.set('lastwin',null)}}
      clean(new Set(list.map(x=>x.id)));
      if(list.length){list.forEach(o=>create({id:o.id,b:o.b,max:o.max,rb:o.rb,mode:'startup',noFocus:true}));focusWin(wins[wins.length-1],true)}
      else create({mode:'startup',max:true});
    }else{
      clean(new Set());
      create({mode:'startup',max:true});
    }
  })();
})();
</script>
